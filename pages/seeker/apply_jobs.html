<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apply for Jobs</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <script src="../../js/navbar.js" defer></script>
  <style>
    .resume-upload {
      margin-top: 10px;
    }
  </style>
</head>
<body class="seeker-page">
  <div id="navbar" data-role="seeker"></div>

  <div class="content">
    <h1 style="text-align:center;">Search and Apply for Jobs</h1>
    
    <!-- Search Form Card -->
    <div class="form-card" style="margin-top: 1.5rem; margin-bottom: 2rem;">
      <form id="jobSearchForm" onsubmit="searchJobs(event)">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="jobRole">Search by Job Role:</label>
          <div style="display: flex; gap: 1rem; align-items: center; width: 100%;">
            <input type="text" id="jobRole" name="jobRole" placeholder="e.g. AI Engineer, Full-Stack Developer, Product Manager" style="flex: 1; margin: 0;">
            <button type="submit" class="btn" style="padding: 0.8rem 2rem; margin: 0; white-space: nowrap;">Search Jobs</button>
          </div>
        </div>
      </form>
    </div>

    <!-- Results Table -->
    <div id="jobsContainer" class="jobs-table-container"></div>
  </div>
  <footer>
    <p>&copy; 2025 Job Portal. All rights reserved.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      searchJobs();
    });

    function searchJobs(event) {
      if (event) event.preventDefault();
      const jobRole = document.getElementById('jobRole').value;

      fetch(`../../php/fetch_jobs.php?jobRole=${encodeURIComponent(jobRole)}`)
        .then(response => {
          if (!response.ok) {
            return response.json().then(err => { throw new Error(err.error || 'Server error'); });
          }
          return response.json();
        })
        .then(jobs => {
          const container = document.getElementById('jobsContainer');
          container.innerHTML = '';

          if (jobs.length === 0) {
            container.innerHTML = "<p style='text-align: center; color: #555;'>No jobs found for the entered role.</p>";
            return;
          }

          let tableHTML = `
            <table>
              <thead>
                <tr>
                  <th>Job Title</th>
                  <th>Company Name</th>
                  <th>Location</th>
                  <th>Description</th>
                  <th>Posted On</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
          `;

          jobs.forEach(job => {
            const action = job.applied > 0
              ? `<button class="apply-btn" disabled>Applied</button>`
              : `
                <form onsubmit="applyJob(event, ${job.id})" enctype="multipart/form-data">
                  <input type="file" name="resume" accept="application/pdf" class="resume-upload" required>
                  <button type="submit" class="apply-btn">Apply</button>
                </form>
              `;

            tableHTML += `
              <tr>
                <td>${job.title}</td>
                <td>${job.company_name}</td>
                <td>${job.location}</td>
                <td>${job.description}</td>
                <td>${job.created_at}</td>
                <td>${action}</td>
              </tr>
            `;
          });

          tableHTML += `</tbody></table>`;
          container.innerHTML = tableHTML;
        })
        .catch(err => {
          console.error('Error fetching jobs:', err);
          const container = document.getElementById('jobsContainer');
          if (err.message.includes('Unauthorized')) {
            container.innerHTML = `<div style="text-align: center; padding: 20px; background: rgba(248, 215, 218, 0.9); color: #721c24; border-radius: 8px; border: 1px solid #f5c6cb; max-width: 600px; margin: 0 auto;">
              <strong>Session Expired or Unauthorized:</strong><br><br>
              Please <a href="../../login.html" style="color: #721c24; text-decoration: underline; font-weight: bold;">Log In</a> as a job seeker to search and apply for jobs.
            </div>`;
          } else {
            container.innerHTML = `<p style="text-align: center; color: #e74c3c;">Failed to load jobs. Please try again later.</p>`;
          }
        });
    }

    function applyJob(event, jobId) {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);
      formData.append('job_id', jobId);

      fetch('../../php/apply_job.php', {
        method: 'POST',
        body: formData
      })
      .then(response => response.text())
      .then(result => {
        alert(result);
        document.getElementById('jobSearchForm').dispatchEvent(new Event('submit')); // Refresh jobs
      })
      .catch(err => {
        console.error('Error applying:', err);
      });
    }
  </script>
</body>
</html>
